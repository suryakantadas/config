spring.application.name=irctc-bookings
server.port=8082

# MySQL Database Configuration
 spring.datasource.url=jdbc:mysql://localhost:3306/demo2
# spring.datasource.url=jdbc:mysql://host.docker.internal:3306/demo
spring.datasource.username=root
spring.datasource.password=Surya@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.application.name=Payment Service
info.application.description=IRCTC Payment Microservice
info.application.version=1.0.0


bootstrap.servers=localhost:9092

# Serializer
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
